<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Admin | Chef's Table Catering</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Oswald:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue:#0133C8; --blue-dark:#0128A0; --blue-pale:#EEF1FB;
      --gray:#6C6C6C; --green:#2e7d32; --red:#c0392b;
      --gold:#C8A835; --white:#fff; --cream:#fafbff; --black:#111;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Lato',sans-serif;background:#f0f2f8;color:var(--black);line-height:1.6;}

    /* LOGIN */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
    .login-box{background:var(--white);border:2px solid #dde2f0;border-top:5px solid var(--blue);border-radius:6px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(1,51,200,.12);}
    .login-box h1{font-size:1.4rem;margin-bottom:.25rem;color:var(--blue-dark);}
    .login-box p{color:var(--gray);font-size:.9rem;margin-bottom:1.75rem;}

    /* LAYOUT */
    #admin-screen{display:none;}
    .admin-header{background:var(--blue-dark);color:#fff;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
    .admin-header h1{font-family:'Oswald',sans-serif;font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase;}
    .admin-body{max-width:1300px;margin:0 auto;padding:2rem;}

    /* TABS */
    .tabs{display:flex;gap:.5rem;margin-bottom:2rem;border-bottom:2px solid #dde2f0;flex-wrap:wrap;}
    .tab-btn{padding:.75rem 1.5rem;background:none;border:none;font-family:'Lato',sans-serif;font-size:.88rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s;}
    .tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
    .tab-panel{display:none;} .tab-panel.active{display:block;}

    /* CARDS */
    .card{background:var(--white);border:2px solid #dde2f0;border-radius:6px;padding:1.75rem;margin-bottom:1.5rem;}
    .card-title{font-size:1.1rem;font-weight:700;color:var(--blue-dark);border-bottom:2px solid var(--blue-pale);padding-bottom:.75rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}

    /* ITEM CARDS */
    .item-card{background:var(--white);border:2px solid #dde2f0;border-left:5px solid var(--blue);border-radius:6px;padding:1.5rem;margin-bottom:1.25rem;}
    .item-card.hidden-item{border-left-color:var(--gray);opacity:.75;}
    .item-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;}
    .item-name-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
    .item-name{font-size:1.1rem;font-weight:700;}
    .mode-badge{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .5rem;border-radius:3px;}
    .badge-max{background:#e3f2fd;color:#0d47a1;}
    .badge-stock{background:#e8f5e9;color:#1b5e20;}
    .price-tag{font-size:.9rem;color:var(--gray);}

    /* STATS ROW */
    .stats-row{display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.25rem;}
    .stat{text-align:center;min-width:70px;}
    .stat-num{font-size:1.8rem;font-weight:700;line-height:1;display:block;}
    .c-green{color:var(--green);} .c-red{color:var(--red);} .c-gray{color:var(--gray);} .c-gold{color:var(--gold);}
    .stat-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);margin-top:.2rem;}

    /* CONTROLS */
    .controls-row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end;padding-top:1.25rem;border-top:1px solid #eee;}
    .ctrl{display:flex;flex-direction:column;gap:.3rem;}
    .ctrl label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);}
    .ctrl input,.ctrl select{padding:.5rem .75rem;border:2px solid #dde2f0;border-radius:4px;font-size:.95rem;width:130px;}
    .ctrl input:focus,.ctrl select:focus{outline:3px solid rgba(1,51,200,.25);border-color:var(--blue);}

    /* FORMS */
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
    .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:1rem;}
    .form-group{display:flex;flex-direction:column;gap:.3rem;}
    .form-group label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);}
    .form-group input,.form-group select,.form-group textarea{padding:.6rem .9rem;border:2px solid #dde2f0;border-radius:4px;font-family:'Lato',sans-serif;font-size:.95rem;background:var(--cream);}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:3px solid rgba(1,51,200,.25);border-color:var(--blue);}
    .form-group textarea{min-height:80px;resize:vertical;}
    .form-help{font-size:.78rem;color:var(--gray);font-style:italic;margin-top:.2rem;}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;border-radius:4px;font-family:'Lato',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:2px solid transparent;transition:background .2s,color .2s;}
    .btn-blue{background:var(--blue);color:#fff;border-color:var(--blue-dark);}
    .btn-blue:hover{background:var(--blue-dark);}
    .btn-green{background:var(--green);color:#fff;}
    .btn-green:hover{background:#1b5e20;}
    .btn-red{background:var(--red);color:#fff;}
    .btn-red:hover{background:#96201a;}
    .btn-gray{background:#e0e0e0;color:var(--black);}
    .btn-gray:hover{background:#ccc;}
    .btn-gold{background:var(--gold);color:#fff;}
    .btn-gold:hover{background:#a8902a;}
    .btn-outline{background:none;color:var(--blue);border-color:var(--blue);}
    .btn-outline:hover{background:var(--blue);color:#fff;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}

    /* ORDERS TABLE */
    .tbl-wrap{overflow-x:auto;}
    .orders-table{width:100%;border-collapse:collapse;font-size:.85rem;}
    .orders-table th{background:var(--blue-pale);color:var(--blue-dark);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;padding:.6rem .9rem;text-align:left;white-space:nowrap;}
    .orders-table td{padding:.6rem .9rem;border-bottom:1px solid #eee;vertical-align:top;}
    .orders-table tr:hover td{background:#f8f9ff;}
    .sbadge{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border-radius:3px;}
    .s-pending{background:#fff3cd;color:#856404;}
    .s-fulfilled{background:#d4edda;color:#155724;}
    .s-cancelled{background:#f8d7da;color:#721c24;}
    .s-archived{background:#e2e3e5;color:#383d41;}

    /* FILTER BAR */
    .filter-bar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem;}
    .filter-bar select,.filter-bar input{padding:.45rem .75rem;border:2px solid #dde2f0;border-radius:4px;font-size:.85rem;}

    /* STATUS */
    .smsg{padding:.75rem 1rem;border-radius:4px;margin:.75rem 0;font-weight:700;font-size:.88rem;}
    .smsg-success{background:#d4edda;color:#155724;}
    .smsg-error{background:#f8d7da;color:#721c24;}
    .smsg-info{background:#cce5ff;color:#004085;}

    /* TOGGLE */
    .vis-toggle{display:flex;align-items:center;gap:.5rem;cursor:pointer;user-select:none;}
    .tog{width:40px;height:21px;background:#ccc;border-radius:11px;position:relative;transition:background .2s;flex-shrink:0;}
    .tog.on{background:var(--green);}
    .tog::after{content:'';width:17px;height:17px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .2s;}
    .tog.on::after{left:21px;}
    .tog-label{font-size:.8rem;font-weight:700;color:var(--gray);}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;}
    .modal{background:var(--white);border-radius:8px;padding:2rem;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
    .modal h2{margin-bottom:1.5rem;font-size:1.2rem;color:var(--blue-dark);}
    .modal-footer{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid #eee;}

    /* MISC */
    .section-divider{border:none;border-top:2px solid var(--blue-pale);margin:2rem 0;}
    .logout-btn{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:.35rem .85rem;border-radius:4px;font-size:.82rem;cursor:pointer;}
    .logout-btn:hover{background:rgba(255,255,255,.1);}
    .refresh-info{font-size:.75rem;color:rgba(255,255,255,.6);}
    .empty-state{text-align:center;padding:3rem;color:var(--gray);}

    @media(max-width:600px){
      .form-row,.form-row-3{grid-template-columns:1fr;}
      .admin-body{padding:1rem;}
    }
    /* ADDED NOV 2026 */
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
    #edit-form > .form-group,#add-form > .form-group,.event-only > .form-group{margin-bottom:1rem;}
    .form-group input,.form-group select,.form-group textarea{min-width:0;width:100%;}
    .vis-toggle:focus-within .tog{outline:3px solid rgba(1,51,200,.35);outline-offset:2px;}
    .login-box input{width:100%;padding:.7rem .9rem;border:2px solid #dde2f0;border-radius:4px;font-size:1rem;margin-bottom:1rem;}
    .login-box label{display:block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);margin-bottom:.35rem;}
    .summary-strip{display:flex;gap:1.5rem;flex-wrap:wrap;background:var(--blue-pale);border-radius:6px;padding:1rem 1.25rem;margin-bottom:1.25rem;}
    .order-card{border:2px solid #dde2f0;border-left:5px solid #ffc107;border-radius:6px;padding:1rem 1.25rem;margin-bottom:.85rem;background:#fff;}
    .order-card.st-fulfilled{border-left-color:var(--green);background:#fbfefb;}
    .order-card.st-cancelled{border-left-color:var(--red);opacity:.7;}
    .order-card.st-archived{border-left-color:var(--gray);opacity:.6;}
    .order-top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
    .order-who{font-weight:700;font-size:1.05rem;}
    .order-contact{font-size:.88rem;color:var(--gray);}
    .order-contact a{color:var(--blue);}
    .order-items{margin:.5rem 0;font-size:.95rem;}
    .order-items li{list-style:none;}
    .order-requests{background:#fff3cd;border:1px solid #ffe08a;border-radius:4px;padding:.45rem .7rem;font-size:.9rem;margin:.4rem 0;}
    .order-pickup{font-size:.85rem;color:var(--gray);}
    .order-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.6rem;}
    .order-total{font-weight:700;text-align:right;white-space:nowrap;}
    .order-date{font-size:.8rem;color:var(--gray);text-align:right;}
    .chk{display:flex;align-items:center;gap:.5rem;font-size:.9rem;font-weight:700;}
    .chk input{width:18px;height:18px;}
    .field-hint{font-size:.78rem;color:var(--gray);}
    .event-only[hidden],.stock-only[hidden],.cap-only[hidden]{display:none!important;}
    .btn-sm{padding:.35rem .7rem;font-size:.72rem;}
    @media print{
      body{background:#fff;}
      #admin-screen > *:not(.print-area),#login-screen{display:none!important;}
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-screen">
  <form class="login-box" id="login-form">
    <h1>Chef's Table Shop Admin</h1>
    <p>Orders, products &amp; inventory</p>
    <div id="login-err" style="display:none;" class="smsg smsg-error" role="alert"></div>
    <label for="login-pw">Password</label>
    <input type="password" id="login-pw" autocomplete="current-password" required>
    <button class="btn btn-blue" id="login-btn" type="submit" style="width:100%;justify-content:center;">Sign In</button>
  </form>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <header class="admin-header">
    <h1>Chef's Table &mdash; Shop Admin</h1>
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
      <span class="refresh-info" id="refresh-time"></span>
      <button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.4);font-size:.78rem;" onclick="loadDashboard()">Refresh</button>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <div class="admin-body">
    <div id="global-msg" style="display:none;" class="smsg" role="status"></div>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" role="tab" data-tab="orders">Orders</button>
      <button class="tab-btn" role="tab" data-tab="products">Products</button>
      <button class="tab-btn" role="tab" data-tab="add">Add Product</button>
    </div>

    <!-- ORDERS -->
    <div class="tab-panel active" id="tab-orders">
      <div class="card">
        <div class="card-title">
          Orders
          <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
            <button class="btn btn-gray btn-sm" onclick="printPickupList()">Print pickup list</button>
            <button class="btn btn-gray btn-sm" onclick="exportOrders()">Download spreadsheet (CSV)</button>
            <button class="btn btn-outline btn-sm" onclick="importStripe()" title="Pulls in any paid Stripe checkouts that are missing from this list">Sync from Stripe</button>
            <button class="btn btn-outline btn-sm" onclick="testAlert()" title="Sends a sample new-order email to check the email setup">Send test order email</button>
          </div>
        </div>
        <div class="filter-bar">
          <label class="sr-only" for="f-item">Product</label>
          <select id="f-item"><option value="">All products</option></select>
          <label class="sr-only" for="f-status">Status</label>
          <select id="f-status">
            <option value="pending">Waiting for pickup</option>
            <option value="fulfilled">Picked up</option>
            <option value="cancelled">Cancelled</option>
            <option value="active">Waiting + picked up</option>
            <option value="">All</option>
          </select>
          <label class="sr-only" for="f-search">Search</label>
          <input type="search" id="f-search" placeholder="Search name, email, phone, requests" style="min-width:240px;">
          <label class="chk" style="font-weight:400;"><input type="checkbox" id="f-requests"> Only orders with special requests</label>
        </div>
        <div id="orders-summary"></div>
        <div id="orders-list"><div class="empty-state">Loading orders...</div></div>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div class="tab-panel" id="tab-products">
      <div id="products-list"><div class="empty-state">Loading products...</div></div>
    </div>

    <!-- ADD -->
    <div class="tab-panel" id="tab-add">
      <div class="card">
        <div class="card-title">Add a Product</div>
        <p class="field-hint" style="margin-bottom:1rem;">Tip: for next season's meal kit, use <strong>Copy for next season</strong> on the Products tab instead. It copies everything, so you only change the dates.</p>
        <div id="add-form"></div>
        <div id="add-msg"></div>
        <button class="btn btn-blue" onclick="saveNewProduct()">Add Product</button>
      </div>
    </div>
  </div>

  <div class="print-area" id="print-area" hidden></div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="edit-title">
  <div class="modal" style="max-width:720px;">
    <h2 id="edit-title">Edit Product</h2>
    <div id="edit-form"></div>
    <div id="edit-msg"></div>
    <div class="modal-footer">
      <button class="btn btn-gray" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-blue" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script>
var PW_KEY = 'ctc_admin_pw';
var state = { items: [], orders: [] };
var editingId = null;

function getPw() { try { return sessionStorage.getItem(PW_KEY) || ''; } catch (e) { return window.__pw || ''; } }
function setPw(v) { try { if (v) sessionStorage.setItem(PW_KEY, v); else sessionStorage.removeItem(PW_KEY); } catch (e) {} window.__pw = v; }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function money(c) { return '$' + ((c || 0) / 100).toFixed(2); }
function fmtDateTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function fmtYmd(ymd) {
  if (!ymd) return '';
  return new Date(ymd + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function toLocalInput(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function showMsg(elId, msg, type) {
  var el = document.getElementById(elId);
  if (!el) return;
  if (!msg) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.className = 'smsg smsg-' + (type || 'info');
  el.textContent = msg;
  el.style.display = 'block';
  if (elId === 'global-msg' && type !== 'error') setTimeout(function () { el.style.display = 'none'; }, 5000);
}

// ---------------------------------------------------------------- API
async function api(body) {
  body.password = getPw();
  var r = await fetch('/.netlify/functions/shop-admin', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  var data = {};
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401) { logout('Your session ended. Please sign in again.'); throw new Error('Signed out'); }
  if (!r.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

// ---------------------------------------------------------------- Login
document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var pw = document.getElementById('login-pw').value;
  var btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  showMsg('login-err', '');
  setPw(pw);
  try {
    var r = await fetch('/.netlify/functions/shop-admin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', password: pw }),
    });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(d.error || 'Could not sign in.');
    enterAdmin();
  } catch (err) {
    setPw('');
    showMsg('login-err', err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});

function enterAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  document.getElementById('login-pw').value = '';
  loadDashboard();
}

function logout(msg) {
  setPw('');
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  if (typeof msg === 'string') showMsg('login-err', msg, 'error');
}

// ---------------------------------------------------------------- Tabs
document.querySelectorAll('.tab-btn').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.tab-btn').forEach(function (x) { x.classList.toggle('active', x === b); });
    document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.toggle('active', p.id === 'tab-' + b.dataset.tab); });
  });
});

// ---------------------------------------------------------------- Dashboard
async function loadDashboard() {
  try {
    var d = await api({ action: 'get_dashboard' });
    state.items = d.items || [];
    state.orders = d.orders || [];
    document.getElementById('refresh-time').textContent = 'Updated ' + new Date().toLocaleTimeString();
    fillItemFilter();
    renderOrders();
    renderProducts();
  } catch (e) {
    if (e.message !== 'Signed out') showMsg('global-msg', e.message, 'error');
  }
}

function fillItemFilter() {
  var sel = document.getElementById('f-item');
  var cur = sel.value;
  var firstLoad = !sel.dataset.loaded;
  sel.innerHTML = '<option value="">All products</option>' + state.items.map(function (i) {
    return '<option value="' + i.id + '">' + esc(i.name) + (i.visible ? '' : ' (hidden)') + '</option>';
  }).join('');
  if (firstLoad) {
    // Default to the visible holiday kit, since that is what people check most.
    var ev = state.items.find(function (i) { return i.visible && i.pickup_mode === 'event'; });
    sel.value = ev ? String(ev.id) : '';
    sel.dataset.loaded = '1';
  } else {
    sel.value = cur;
  }
}

['f-item', 'f-status', 'f-requests'].forEach(function (id) { document.getElementById(id).addEventListener('change', renderOrders); });
document.getElementById('f-search').addEventListener('input', renderOrders);

// ---------------------------------------------------------------- Orders
// One Stripe checkout can include several products; they are grouped into one card.
function groupOrders(rows) {
  var map = {}, list = [];
  rows.forEach(function (o) {
    var key = o.order_ref || ('row-' + o.id);
    if (!map[key]) { map[key] = { key: key, ref: o.order_ref, id: o.id, lines: [], first: o }; list.push(map[key]); }
    map[key].lines.push(o);
  });
  list.forEach(function (g) {
    var st = g.lines.map(function (l) { return l.status; });
    g.status = st.indexOf('pending') >= 0 ? 'pending' : st.indexOf('fulfilled') >= 0 ? 'fulfilled' : st[0];
    g.total = g.lines.reduce(function (s, l) { return s + (l.total_cents || 0); }, 0);
  });
  return list;
}

function filteredGroups() {
  var itemId = document.getElementById('f-item').value;
  var status = document.getElementById('f-status').value;
  var q = document.getElementById('f-search').value.trim().toLowerCase();
  var reqOnly = document.getElementById('f-requests').checked;
  var groups = groupOrders(state.orders);
  return groups.filter(function (g) {
    if (itemId && !g.lines.some(function (l) { return String(l.item_id) === itemId; })) return false;
    if (status === 'active' && !(g.status === 'pending' || g.status === 'fulfilled')) return false;
    if (status && status !== 'active' && g.status !== status) return false;
    if (reqOnly && !g.first.notes) return false;
    if (q) {
      var hay = [g.first.buyer_name, g.first.buyer_email, g.first.buyer_phone, g.first.notes].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function renderOrders() {
  var groups = filteredGroups();
  var itemId = document.getElementById('f-item').value;

  // Summary for the selected product
  var sum = '';
  if (itemId) {
    var it = state.items.find(function (i) { return String(i.id) === itemId; });
    if (it) {
      var cap = it.inventory_mode === 'max_units' ? it.max_units : it.current_stock;
      var withReq = groupOrders(state.orders).filter(function (g) {
        return g.status === 'pending' && g.first.notes && g.lines.some(function (l) { return String(l.item_id) === itemId; });
      }).length;
      sum = '<div class="summary-strip">' +
        stat(it.pending_qty + it.fulfilled_qty, 'Sold', 'c-gold') +
        stat(it.pending_qty, 'Waiting for pickup', '') +
        stat(it.fulfilled_qty, 'Picked up', 'c-green') +
        stat(it.available, 'Left to sell', it.available ? 'c-green' : 'c-red') +
        stat(cap, it.inventory_mode === 'max_units' ? 'Limit' : 'Stock', 'c-gray') +
        stat(withReq, 'With special requests', withReq ? 'c-red' : 'c-gray') +
        '</div>';
    }
  }
  document.getElementById('orders-summary').innerHTML = sum;

  var el = document.getElementById('orders-list');
  if (!groups.length) { el.innerHTML = '<div class="empty-state">No orders match these filters.</div>'; return; }

  el.innerHTML = groups.map(function (g) {
    var o = g.first;
    var phone = o.buyer_phone ? '<a href="tel:' + esc(o.buyer_phone) + '">' + esc(o.buyer_phone) + '</a>' : 'no phone';
    var items = g.lines.map(function (l) {
      return '<li><strong>' + l.quantity + ' &times; ' + esc(l.item_name) + '</strong>' +
        (l.status !== g.status ? ' <span class="sbadge s-' + l.status + '">' + l.status + '</span>' : '') + '</li>';
    }).join('');
    var label = { pending: 'Waiting for pickup', fulfilled: 'Picked up', cancelled: 'Cancelled', archived: 'Archived' }[g.status] || g.status;
    var target = g.ref ? 'data-ref="' + esc(g.ref) + '"' : 'data-id="' + g.id + '"';
    var actions = '';
    if (g.status === 'pending') {
      actions = '<button class="btn btn-green btn-sm" data-act="fulfilled" ' + target + '>Mark picked up</button>' +
                '<button class="btn btn-gray btn-sm" data-act="cancelled" ' + target + '>Cancel order</button>';
    } else if (g.status === 'fulfilled' || g.status === 'cancelled') {
      actions = '<button class="btn btn-gray btn-sm" data-act="pending" ' + target + '>Undo (back to waiting)</button>';
    }
    return '<div class="order-card st-' + g.status + '">' +
      '<div class="order-top">' +
        '<div><div class="order-who">' + esc(o.buyer_name || '(no name)') + '</div>' +
        '<div class="order-contact">' + phone + ' &middot; <a href="mailto:' + esc(o.buyer_email) + '">' + esc(o.buyer_email) + '</a></div></div>' +
        '<div><div class="order-total">' + money(g.total) + '</div><div class="order-date">Ordered ' + fmtDateTime(o.created_at) + '</div></div>' +
      '</div>' +
      '<ul class="order-items">' + items + '</ul>' +
      (o.notes ? '<div class="order-requests"><strong>Special requests:</strong> ' + esc(o.notes) + '</div>' : '') +
      '<div class="order-pickup">Pickup: ' + esc(o.pickup_details || fmtYmd(o.pickup_date) || 'not set') + '</div>' +
      '<div class="order-actions"><span class="sbadge s-' + g.status + '">' + label + '</span>' + actions + '</div>' +
    '</div>';
  }).join('');
}

function stat(n, label, cls) {
  return '<div class="stat"><span class="stat-num ' + (cls || '') + '">' + (n == null ? 0 : n) + '</span><div class="stat-label">' + label + '</div></div>';
}

document.getElementById('orders-list').addEventListener('click', async function (e) {
  var b = e.target.closest('button[data-act]');
  if (!b) return;
  var status = b.dataset.act;
  if (status === 'cancelled' && !confirm('Cancel this order? This frees up the item for someone else.\n\nIt does NOT refund the customer. Refund them in Stripe if needed.')) return;
  b.disabled = true;
  try {
    var body = { action: 'set_order_status', status: status };
    if (b.dataset.ref) body.order_ref = b.dataset.ref; else body.order_id = b.dataset.id;
    await api(body);
    await loadDashboard();
  } catch (err) { b.disabled = false; showMsg('global-msg', err.message, 'error'); }
});

function exportOrders() {
  var groups = filteredGroups();
  var rows = [['Ordered', 'Name', 'Phone', 'Email', 'Items', 'Total', 'Special requests', 'Pickup', 'Status']];
  groups.forEach(function (g) {
    var o = g.first;
    rows.push([fmtDateTime(o.created_at), o.buyer_name, o.buyer_phone || '', o.buyer_email,
      g.lines.map(function (l) { return l.quantity + ' x ' + l.item_name; }).join('; '),
      (g.total / 100).toFixed(2), o.notes || '', o.pickup_details || o.pickup_date || '', g.status]);
  });
  var csv = rows.map(function (r) { return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'chefs-table-orders-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
}

function printPickupList() {
  var groups = filteredGroups().filter(function (g) { return g.status === 'pending' || g.status === 'fulfilled'; });
  groups.sort(function (a, b) {
    var la = (a.first.buyer_name || '').trim().split(/\s+/).pop().toLowerCase();
    var lb = (b.first.buyer_name || '').trim().split(/\s+/).pop().toLowerCase();
    return la < lb ? -1 : la > lb ? 1 : 0;
  });
  var itemSel = document.getElementById('f-item');
  var title = itemSel.value ? itemSel.options[itemSel.selectedIndex].text : 'All products';
  var totals = {};
  groups.forEach(function (g) { g.lines.forEach(function (l) { totals[l.item_name] = (totals[l.item_name] || 0) + l.quantity; }); });
  var html = '<h2 style="font-family:Lato,sans-serif;">Pickup list: ' + esc(title) + '</h2>' +
    '<p style="font-family:Lato,sans-serif;">' + groups.length + ' orders &middot; ' +
    Object.keys(totals).map(function (k) { return totals[k] + ' ' + esc(k); }).join(' &middot; ') +
    ' &middot; printed ' + new Date().toLocaleString() + '</p>' +
    '<table style="width:100%;border-collapse:collapse;font-family:Lato,sans-serif;font-size:12px;">' +
    '<tr>' + ['&#10003;', 'Name', 'Phone', 'Items', 'Special requests'].map(function (h) {
      return '<th style="text-align:left;border-bottom:2px solid #000;padding:6px;">' + h + '</th>';
    }).join('') + '</tr>' +
    groups.map(function (g) {
      var o = g.first;
      var td = function (v) { return '<td style="border-bottom:1px solid #999;padding:6px;vertical-align:top;">' + v + '</td>'; };
      return '<tr>' + td(g.status === 'fulfilled' ? '&#10003;' : '&#9744;') + td(esc(o.buyer_name)) + td(esc(o.buyer_phone || '')) +
        td(g.lines.map(function (l) { return l.quantity + ' &times; ' + esc(l.item_name); }).join('<br>')) + td(esc(o.notes || '')) + '</tr>';
    }).join('') + '</table>';
  var area = document.getElementById('print-area');
  area.innerHTML = html;
  area.hidden = false;
  window.print();
  area.hidden = true;
}

async function testAlert() {
  showMsg('global-msg', 'Sending a test order email...', 'info');
  try {
    var r = await api({ action: 'test_alert' });
    showMsg('global-msg', 'Test email sent to ' + (r.to || []).join(', ') + '. Check the inbox (and spam folder).', 'success');
  } catch (e) { showMsg('global-msg', e.message, 'error'); }
}

async function importStripe() {
  showMsg('global-msg', 'Checking Stripe for orders from the last 60 days...', 'info');
  try {
    var r = await api({ action: 'import_stripe', days: 60 });
    showMsg('global-msg', r.recorded ? ('Added ' + r.recorded + ' missing order line(s) from Stripe.') : 'Everything is already up to date.', 'success');
    await loadDashboard();
  } catch (e) { showMsg('global-msg', e.message, 'error'); }
}

// ---------------------------------------------------------------- Products
function renderProducts() {
  var el = document.getElementById('products-list');
  if (!state.items.length) { el.innerHTML = '<div class="empty-state">No products yet.</div>'; return; }
  el.innerHTML = state.items.map(function (i) {
    var isMax = i.inventory_mode === 'max_units';
    var pickup = i.pickup_mode === 'event'
      ? 'Pickup ' + esc([fmtYmd(i.pickup_date), i.pickup_window, i.pickup_location].filter(Boolean).join(', ') || 'not set')
      : 'Weekday pickup at the kitchen (customer picks a date)';
    var deadline = i.order_deadline ? ' &middot; Ordering closes ' + fmtDateTime(i.order_deadline) : '';
    var statusTxt = i.status === 'closed' ? '<span class="sbadge s-cancelled">Ordering closed</span>' :
                    i.status === 'sold_out' ? '<span class="sbadge s-cancelled">Sold out</span>' : '';
    var ctrl = isMax
      ? '<div class="ctrl"><label for="cap-' + i.id + '">Total to sell</label><input type="number" min="0" id="cap-' + i.id + '" value="' + (i.max_units || 0) + '"></div>' +
        '<button class="btn btn-blue btn-sm" onclick="saveCap(' + i.id + ')">Update limit</button>'
      : '<div class="ctrl"><label for="add-' + i.id + '">Add to stock</label><input type="number" id="add-' + i.id + '" placeholder="e.g. 12"></div>' +
        '<button class="btn btn-blue btn-sm" onclick="addStock(' + i.id + ')">Add</button>' +
        '<div class="ctrl"><label for="reset-' + i.id + '">Recount stock</label><input type="number" min="0" id="reset-' + i.id + '" placeholder="On hand now"></div>' +
        '<button class="btn btn-gray btn-sm" onclick="resetStock(' + i.id + ')">Set</button>';
    return '<div class="item-card' + (i.visible ? '' : ' hidden-item') + '">' +
      '<div class="item-header">' +
        '<div><div class="item-name-row"><span class="item-name">' + esc((i.icon ? i.icon + ' ' : '') + i.name) + '</span>' + statusTxt + '</div>' +
        '<div class="price-tag">' + money(i.price_cents) + (i.taxable === false ? ', no sales tax' : ' + sales tax') + ' &middot; up to ' + (i.max_per_order || 10) + ' per order</div>' +
        '<div class="field-hint">' + pickup + deadline + '</div></div>' +
        '<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">' +
          '<label class="vis-toggle" title="Show on the Shop page"><input type="checkbox" class="sr-only" ' + (i.visible ? 'checked' : '') + ' onchange="toggleVis(' + i.id + ', this.checked)">' +
          '<span class="tog' + (i.visible ? ' on' : '') + '" aria-hidden="true"></span><span class="tog-label">' + (i.visible ? 'On shop page' : 'Hidden') + '</span></label>' +
          '<button class="btn btn-outline btn-sm" onclick="openEdit(' + i.id + ')">Edit</button>' +
          '<button class="btn btn-gray btn-sm" onclick="duplicateItem(' + i.id + ')">Copy for next season</button>' +
        '</div>' +
      '</div>' +
      '<div class="stats-row">' +
        stat(i.available, 'Left to sell', i.available ? 'c-green' : 'c-red') +
        stat(i.pending_qty, 'Waiting for pickup', '') +
        stat(i.fulfilled_qty, 'Picked up', 'c-green') +
        stat(isMax ? i.max_units : i.current_stock, isMax ? 'Limit' : 'Stock', 'c-gray') +
      '</div>' +
      '<div class="controls-row">' + ctrl + '</div>' +
    '</div>';
  }).join('');
}

async function quick(body, okMsg) {
  try { await api(body); showMsg('global-msg', okMsg, 'success'); await loadDashboard(); }
  catch (e) { showMsg('global-msg', e.message, 'error'); }
}
function saveCap(id) { quick({ action: 'update_item', item_id: id, item: { max_units: document.getElementById('cap-' + id).value } }, 'Limit updated.'); }
function addStock(id) { quick({ action: 'add_stock', item_id: id, add_qty: document.getElementById('add-' + id).value }, 'Stock added.'); }
function resetStock(id) {
  var v = document.getElementById('reset-' + id).value;
  if (v === '' || !confirm('Set stock on hand to ' + v + '? Orders already picked up stop counting against stock.')) return;
  quick({ action: 'reset_stock', item_id: id, new_stock: v }, 'Stock updated.');
}
function toggleVis(id, vis) { quick({ action: 'update_item', item_id: id, item: { visible: vis } }, vis ? 'Now showing on the shop page.' : 'Hidden from the shop page.'); }
function duplicateItem(id) {
  var src = state.items.find(function (i) { return i.id === id; });
  var name = prompt('Name for the copy:', src.name);
  if (!name) return;
  var slug = prompt('Short web name for the copy (lowercase, hyphens), e.g. easter-2027:', src.slug.replace(/\d{4}$/, '') + (new Date().getFullYear() + 1));
  if (!slug) return;
  quick({ action: 'duplicate_item', item_id: id, new_name: name, new_slug: slug }, 'Copy created. It is hidden until you edit the dates and switch it on.');
}

// ---------------------------------------------------------------- Product form
function productForm(prefix, i) {
  i = i || { inventory_mode: 'max_units', pickup_mode: 'event', taxable: false, max_per_order: 10, sort_order: 10, visible: false };
  var f = function (id) { return prefix + '-' + id; };
  return '' +
    '<div class="form-row">' +
      fg(f('name'), 'Product name *', '<input id="' + f('name') + '" value="' + esc(i.name || '') + '">') +
      fg(f('slug'), 'Short web name *', '<input id="' + f('slug') + '" value="' + esc(i.slug || '') + '" placeholder="thanksgiving-2027">', 'Lowercase and hyphens. Used in links, e.g. shop.html?item=thanksgiving-2027') +
    '</div>' +
    fg(f('description'), 'Description', '<textarea id="' + f('description') + '">' + esc(i.description || '') + '</textarea>') +
    fg(f('details'), "What's included (one per line)", '<textarea id="' + f('details') + '" style="min-height:120px;">' + esc(i.details || '') + '</textarea>') +
    '<div class="form-row-3">' +
      fg(f('price'), 'Price ($) *', '<input id="' + f('price') + '" type="number" step="0.01" min="0" value="' + (i.price_cents ? (i.price_cents / 100).toFixed(2) : '') + '">') +
      fg(f('max_per_order'), 'Max per order', '<input id="' + f('max_per_order') + '" type="number" min="1" value="' + (i.max_per_order || 10) + '">') +
      fg(f('icon'), 'Icon (emoji)', '<input id="' + f('icon') + '" value="' + esc(i.icon || '') + '" maxlength="8">') +
    '</div>' +
    '<div class="form-group" style="margin-bottom:1rem;"><label class="chk"><input type="checkbox" id="' + f('taxable') + '"' + (i.taxable !== false ? ' checked' : '') + '> Charge sales tax (7.75%)</label>' +
      '<span class="form-help">Leave unchecked for heat-and-serve meal kits.</span></div>' +
    '<div class="form-row">' +
      fg(f('inventory_mode'), 'How quantity works', '<select id="' + f('inventory_mode') + '" onchange="syncForm(\'' + prefix + '\')">' +
        '<option value="max_units"' + (i.inventory_mode === 'max_units' ? ' selected' : '') + '>Fixed number to sell (meal kits)</option>' +
        '<option value="running_stock"' + (i.inventory_mode === 'running_stock' ? ' selected' : '') + '>Stock on hand (pickles)</option></select>') +
      '<div class="cap-only">' + fg(f('max_units'), 'Total to sell', '<input id="' + f('max_units') + '" type="number" min="0" value="' + (i.max_units || 0) + '">') + '</div>' +
      '<div class="stock-only">' + fg(f('current_stock'), 'Stock on hand', '<input id="' + f('current_stock') + '" type="number" min="0" value="' + (i.current_stock || 0) + '">') + '</div>' +
    '</div>' +
    '<div class="form-row">' +
      fg(f('pickup_mode'), 'Pickup', '<select id="' + f('pickup_mode') + '" onchange="syncForm(\'' + prefix + '\')">' +
        '<option value="event"' + (i.pickup_mode === 'event' ? ' selected' : '') + '>One set pickup day (holiday kits)</option>' +
        '<option value="flexible"' + (i.pickup_mode !== 'event' ? ' selected' : '') + '>Customer picks a weekday at the kitchen</option></select>') +
      fg(f('order_deadline'), 'Ordering closes (optional)', '<input id="' + f('order_deadline') + '" type="datetime-local" value="' + toLocalInput(i.order_deadline) + '">', 'Checkout closes automatically at this time.') +
    '</div>' +
    '<div class="event-only"><div class="form-row">' +
      fg(f('pickup_date'), 'Pickup date', '<input id="' + f('pickup_date') + '" type="date" value="' + esc(i.pickup_date || '') + '">') +
      fg(f('pickup_window'), 'Pickup time', '<input id="' + f('pickup_window') + '" value="' + esc(i.pickup_window || '') + '" placeholder="4:00 PM to 6:00 PM">') +
    '</div>' +
    fg(f('pickup_location'), 'Pickup location', '<input id="' + f('pickup_location') + '" value="' + esc(i.pickup_location || '') + '" placeholder="Drekker Brewhalla, 1702 1st Ave N, Fargo">') +
    '</div>' +
    '<div class="form-row">' +
      fg(f('image_url'), 'Photo link (optional)', '<input id="' + f('image_url') + '" value="' + esc(i.image_url || '') + '" placeholder="e.g. thanksgiving-kit.jpg">', 'Leave blank to show the icon instead.') +
      fg(f('sort_order'), 'Position on page', '<input id="' + f('sort_order') + '" type="number" value="' + (i.sort_order == null ? 10 : i.sort_order) + '">', 'Lower numbers show first.') +
    '</div>' +
    '<div class="form-group" style="margin:1rem 0;"><label class="chk"><input type="checkbox" id="' + f('visible') + '"' + (i.visible ? ' checked' : '') + '> Show on the Shop page</label></div>';
}

function fg(id, label, control, help) {
  return '<div class="form-group"><label for="' + id + '">' + label + '</label>' + control + (help ? '<span class="form-help">' + help + '</span>' : '') + '</div>';
}

function syncForm(prefix) {
  var mode = document.getElementById(prefix + '-inventory_mode').value;
  var pick = document.getElementById(prefix + '-pickup_mode').value;
  var root = document.getElementById(prefix === 'edit' ? 'edit-form' : 'add-form');
  root.querySelectorAll('.cap-only').forEach(function (e) { e.hidden = mode !== 'max_units'; });
  root.querySelectorAll('.stock-only').forEach(function (e) { e.hidden = mode !== 'running_stock'; });
  root.querySelectorAll('.event-only').forEach(function (e) { e.hidden = pick !== 'event'; });
}

function readForm(prefix) {
  var v = function (id) { return document.getElementById(prefix + '-' + id).value.trim(); };
  var c = function (id) { return document.getElementById(prefix + '-' + id).checked; };
  var price = parseFloat(v('price'));
  var dl = v('order_deadline');
  return {
    name: v('name'), slug: v('slug').toLowerCase(), description: v('description'), details: v('details'),
    icon: v('icon'), image_url: v('image_url'),
    price_cents: isNaN(price) ? '' : Math.round(price * 100),
    taxable: c('taxable'), inventory_mode: v('inventory_mode'),
    max_units: v('max_units') || 0, current_stock: v('current_stock') || 0,
    max_per_order: v('max_per_order') || 10, sort_order: v('sort_order') || 0,
    pickup_mode: v('pickup_mode'), pickup_date: v('pickup_date'), pickup_window: v('pickup_window'),
    pickup_location: v('pickup_location'),
    // datetime-local is in this computer's time zone; send it as an exact moment.
    order_deadline: dl ? new Date(dl).toISOString() : '',
    visible: c('visible'),
  };
}

function openEdit(id) {
  var item = state.items.find(function (i) { return i.id === id; });
  editingId = id;
  document.getElementById('edit-title').textContent = 'Edit: ' + item.name;
  document.getElementById('edit-form').innerHTML = productForm('edit', item);
  showMsg('edit-msg', '');
  syncForm('edit');
  document.getElementById('edit-modal').style.display = 'flex';
  document.getElementById('edit-name').focus();
}
function closeEdit() { document.getElementById('edit-modal').style.display = 'none'; editingId = null; }
async function saveEdit() {
  try {
    await api({ action: 'update_item', item_id: editingId, item: readForm('edit') });
    closeEdit();
    showMsg('global-msg', 'Product saved.', 'success');
    await loadDashboard();
  } catch (e) { showMsg('edit-msg', e.message, 'error'); }
}
async function saveNewProduct() {
  try {
    await api({ action: 'add_item', item: readForm('add') });
    showMsg('add-msg', 'Product added. Find it on the Products tab.', 'success');
    document.getElementById('add-form').innerHTML = productForm('add');
    syncForm('add');
    await loadDashboard();
  } catch (e) { showMsg('add-msg', e.message, 'error'); }
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && editingId) closeEdit(); });

document.getElementById('add-form').innerHTML = productForm('add');
syncForm('add');

// Stay signed in for this browser tab
if (getPw()) {
  fetch('/.netlify/functions/shop-admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', password: getPw() }) })
    .then(function (r) { if (r.ok) enterAdmin(); else setPw(''); });
}
